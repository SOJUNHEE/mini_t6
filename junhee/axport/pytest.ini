[pytest]
# src 레이아웃. 별도 패키징 없이 import 경로를 잡는다.
# 의존성 관리 방식을 하나로 유지하기 위해 pyproject.toml 을 두지 않는다.
pythonpath = src
testpaths = tests
# 기본 검증은 비밀키·네트워크 없이 재현 가능하다 (CONTRIBUTING §12).
# 외부 API 호출 테스트는 분리한다:  pytest -m external
addopts = -q -m "not external"
markers =
    external: 실제 외부 API 를 호출한다. 키와 네트워크가 필요하다.
